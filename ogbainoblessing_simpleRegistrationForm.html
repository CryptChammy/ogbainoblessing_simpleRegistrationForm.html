<!doctype html>
<html>
  <head>
    <title>Student Registration Form</title>
  </head>

  <body>
    <h2>Student Registration Form</h2>

    <form>
      <label for="name">Name:</label><br />
      <input type="text" id="name" name="name" /><br /><br />

      <label for="password">Password:</label><br />
      <input type="password" id="password" name="password" /><br /><br />

      <label for="email">E-mail ID:</label><br />
      <input type="text" id="email" name="email" /><br /><br />

      <label for="phone">Phone Number:</label><br />
      <input type="text" id="phone" name="phone" /><br /><br />

      <p>Sex:</p>

      <input type="radio" id="male" name="sex" value="Male" />
      <label for="male">Male</label><br />

      <input type="radio" id="female" name="sex" value="Female" />
      <label for="female">Female</label><br /><br />

      <label>Date of Birth:</label><br />

      <select name="day">
        <option value="">Day</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
        <option>13</option>
        <option>14</option>
        <option>15</option>
        <option>16</option>
        <option>17</option>
        <option>18</option>
        <option>19</option>
        <option>20</option>
        <option>21</option>
        <option>22</option>
        <option>23</option>
        <option>24</option>
        <option>25</option>
        <option>26</option>
        <option>27</option>
        <option>28</option>
        <option>29</option>
        <option>30</option>
        <option>31</option>
      </select>

      <select name="month">
        <option value="">Month</option>
        <option>January</option>
        <option>February</option>
        <option>March</option>
        <option>April</option>
        <option>May</option>
        <option>June</option>
        <option>July</option>
        <option>August</option>
        <option>September</option>
        <option>October</option>
        <option>November</option>
        <option>December</option>
      </select>

      <select name="year">
        <option value="">Year</option>
        <option>1980</option>
        <option>1981</option>
        <option>1982</option>
        <option>1983</option>
        <option>1984</option>
        <option>1985</option>
        <option>1986</option>
        <option>1987</option>
        <option>1988</option>
        <option>1989</option>
        <option>1990</option>
        <option>1991</option>
        <option>1992</option>
        <option>1993</option>
        <option>1994</option>
        <option>1995</option>
        <option>1996</option>
        <option>1997</option>
        <option>1998</option>
        <option>1999</option>
        <option>2000</option>
        <option>2001</option>
        <option>2002</option>
        <option>2003</option>
        <option>2004</option>
        <option>2005</option>
        <option>2006</option>
        <option>2007</option>
        <option>2008</option>
        <option>2009</option>
        <option>2010</option>
        <option>2011</option>
        <option>2012</option>
        <option>2013</option>
        <option>2014</option>
        <option>2015</option>
        <option>2016</option>
        <option>2017</option>
        <option>2018</option>
        <option>2019</option>
        <option>2020</option>
        <option>2021</option>
        <option>2022</option>
        <option>2023</option></select
      ><br /><br />

      <p>Languages Spoken:</p>

      <input type="checkbox" id="english" name="language" value="English" />
      <label for="english">English</label><br />

      <input type="checkbox" id="yoruba" name="language" value="Yoruba" />
      <label for="yoruba">Yoruba</label><br />

      <input type="checkbox" id="hausa" name="language" value="Hausa" />
      <label for="hausa">Hausa</label><br />

      <input type="checkbox" id="igbo" name="language" value="Igbo" />
      <label for="igbo">Igbo</label><br />

      <input type="checkbox" id="others" name="language" value="Others" />
      <label for="others">Others</label><br /><br />

      <label for="address">Address:</label><br />
      <textarea id="address" name="address" rows="5" cols="30"></textarea
      ><br /><br />

      <input type="reset" value="Reset" />
      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
